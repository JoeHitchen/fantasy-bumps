name: Build & Publish

concurrency:
  group: build-publish
  cancel-in-progress: false

on:
  workflow_run:
    workflows:
      - Quality Control
    types:
      - completed
    branches:
      - deploy

jobs:
  building:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'deploy' }}
    name: Building
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Docker image
        run: docker build -t joehitchen/fantasy-bumps .

      - name: Run tests to verify image
        run: docker run --rm joehitchen/fantasy-bumps sh -c 'uv sync --group testing && python project.py test'

      - name: Save image
        run: docker save --output fantasy-bumps.docker joehitchen/fantasy-bumps

      - name: Store image artifact
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-bumps-docker
          path: fantasy-bumps.docker

  publishing:
    name: Publishing
    needs: building
    if: ${{ github.event.workflow_run.head_branch == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Retrieve image artifact
        uses: actions/download-artifact@v4
        with:
          name: fantasy-bumps-docker
          path: .

      - name: Load image into Docker
        run: docker load --input fantasy-bumps.docker

      - name: Push Docker image
        run: docker push joehitchen/fantasy-bumps
