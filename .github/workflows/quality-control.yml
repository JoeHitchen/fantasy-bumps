name: Quality Control

on:
  push:
  schedule:
    - cron: '34 3 * * 5'
      timezone: 'Europe/London'

jobs:
  markdown-linting:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-suffix: markdown

      - name: Install dependencies
        run: uv sync --group linting

      - name: Run checks
        run: python project.py markdown

  code-linting:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-suffix: linting

      - name: Install dependencies
        run: uv sync --group linting

      - name: Run checks
        run: python project.py lint

  typing:
    name: Typing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-suffix: typing

      - name: Install dependencies
        run: uv sync --group typing

      - name: Run checks
        run: python project.py type

  testing:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          cache-suffix: testing

      - name: Install dependencies
        run: uv sync

      - name: Run checks
        run: python project.py test
