name: Quality Control

on:
  push:
  schedule:
    - cron: '34 3 * * 5'
      timezone: 'Europe/London'

jobs:
  markdown-linting:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: markdown

      - name: Install dependencies
        run: uv sync --only-group markdown

      - name: Run checks
        run: python project.py markdown

  code-linting:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: linting

      - name: Install dependencies
        run: uv sync --only-group linting

      - name: Run checks
        run: python project.py lint

  typing:
    name: Typing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: typing

      - name: Install dependencies
        run: uv sync --only-group typing

      - name: Run checks
        run: python project.py type

  testing:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: testing

      - name: Install dependencies
        run: uv sync --group testing  # N.B. "uv sync --group ___" also includes base dependencies

      - name: Run checks
        run: python project.py test

  build-and-publish:
    name: Build & Publish
    needs: [markdown-linting, code-linting, typing, testing]
    # TEMPORARY: feature/mock-live-commands added for live verification while building issue #9, remove before merge
    if: contains(fromJSON('["refs/heads/development", "refs/heads/master", "refs/heads/deploy", "refs/heads/feature/mock-live-commands"]'), github.ref)
    uses: ./.github/workflows/build-publish.yml
    with:
      publish: ${{ github.ref == 'refs/heads/deploy' }}
    secrets: inherit
