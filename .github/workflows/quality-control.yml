name: Quality Control

on:
  push:
  schedule:
    - cron: '34 3 * * 5'
      timezone: 'Europe/London'

jobs:
  markdown-linting:
    name: Markdown Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements_linting.txt

      - name: Install dependencies
        run: pip install pymarkdownlnt

      - name: Run checks
        run: python project.py markdown

  code-linting:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements_linting.txt

      - name: Install dependencies
        run: pip install -r requirements_linting.txt

      - name: Run checks
        run: python project.py lint

  typing:
    name: Typing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements_typing.txt

      - name: Install dependencies
        run: pip install -r requirements_typing.txt

      - name: Run checks
        run: python project.py type

  testing:
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements_testing.txt
            requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_testing.txt

      - name: Run checks
        run: python project.py test
