name: Load built image
description: Download the fantasy-bumps-docker build artifact and load it into the local Docker daemon

runs:
  using: composite
  steps:
    - name: Retrieve image artifact
      uses: actions/download-artifact@v8
      with:
        name: fantasy-bumps-docker
        path: .

    - name: Load image into Docker
      shell: bash
      run: docker load --input fantasy-bumps.docker
