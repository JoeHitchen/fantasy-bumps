name: Mock live command
description: >-
  Load the freshly built image, run one of the app's real production commands
  against it, and wait for it to reach a genuine ready state (or fail fast on
  an early crash).

inputs:
  container-name:
    description: Name to give the container (must be unique within the job)
    required: true
  run-args:
    description: Extra arguments to `docker run`, e.g. "-p 8000:8000 -e FOO=bar"
    default: ''
  command:
    description: Command to run inside the container
    required: true
  ready-check:
    description: >-
      Shell command that exits 0 once the container should be considered
      ready. Typically greps `docker logs <container-name>` for a known-good
      line, or curls a port the container publishes.
    required: true
  timeout-seconds:
    description: How long to wait for ready-check before giving up
    default: '30'

runs:
  using: composite
  steps:
    - name: Retrieve image artifact
      uses: actions/download-artifact@v8
      with:
        name: fantasy-bumps-docker
        path: .

    - name: Load image into Docker
      shell: bash
      run: docker load --input fantasy-bumps.docker

    - name: Start container
      shell: bash
      run: docker run -d --name ${{ inputs.container-name }} ${{ inputs.run-args }} joehitchen/fantasy-bumps ${{ inputs.command }}

    - name: Wait for container to become ready
      shell: bash
      run: |
        for i in $(seq 1 ${{ inputs.timeout-seconds }}); do
          if ${{ inputs.ready-check }}; then
            echo "Ready"
            exit 0
          fi
          if [ "$(docker inspect -f '{{.State.Running}}' ${{ inputs.container-name }} 2>/dev/null)" != "true" ]; then
            echo "::error::${{ inputs.container-name }} exited unexpectedly"
            docker logs ${{ inputs.container-name }}
            exit 1
          fi
          sleep 1
        done
        echo "::error::${{ inputs.container-name }} did not become ready within ${{ inputs.timeout-seconds }}s"
        docker logs ${{ inputs.container-name }}
        exit 1

    - name: Stop container
      if: always()
      shell: bash
      run: docker stop ${{ inputs.container-name }} || true
