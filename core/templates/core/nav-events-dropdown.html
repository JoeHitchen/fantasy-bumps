<div class="nav-item dropdown {% if link_text %}d-block d-lg-none{% else %}d-none d-lg-block{% endif %}">
        <a class="nav-link dropdown-toggle" href="#" data-toggle="dropdown"{% if not link_text %} style="margin-left: -0.75em"{% endif %}>{{ link_text }}</a>
        <div class="dropdown-menu">{% for event in events|slice:":3" %}
          <a class="dropdown-item" href="{% url 'fantasy:event' event.tag %}">{{ event }}</a>{% endfor %}
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="{% url 'fantasy:events' %}">All events</a>
        </div>
      </div>
