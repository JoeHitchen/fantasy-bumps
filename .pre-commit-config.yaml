minimum_pre_commit_version: "4.0.0"
fail_fast: true

repos:
  - repo: local
    hooks:

      - id: pymarkdown
        name: Markdown linting (pymarkdownlnt)
        entry: python project.py markdown
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: flake8
        name: Python linting (flake8)
        entry: python project.py lint
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: mypy
        name: Type checking (mypy)
        entry: python project.py type
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: pytest
        name: Unit tests (pytest)
        entry: python project.py test
        language: system
        pass_filenames: false
        stages: [pre-push]
