[flake8]

max-line-length = 99

exclude = 
    .git,
    venv**,
    __pycache__,
    *.pyc,
    migrations,
    manage.py,

ignore =
    E251,
    E303,
    W293,
    W391,
    W503,

import-order-style = pep8app
application-package-names = 
    Bumps,
    core,
    FantasyBumps,
    integrations,
    common,

multiline-quotes = '''


[mypy]
files = integrations
exclude = integrations/pipeline/tasks.py
strict = true
