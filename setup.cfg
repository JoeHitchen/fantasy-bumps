[flake8]

max-line-length = 99

exclude = 
    .git,
    venv**,
    __pycache__,
    *.pyc,
    migrations,
    manage.py,

ignore =
    E251,
    E303,
    W293,
    W391,
    W503,

import-order-style = pep8app
application-package-names = 
    core,
    common,
    fantasy,
    integrations,

multiline-quotes = '''


[mypy]
files = fantasy/constants.py,fantasy/management,fantasy/migrations,fantasy/models*.py,fantasy/transactions*.py,integrations
strict = true
mypy_path=typing
enable_incomplete_feature=Unpack
plugins = mypy_django_plugin.main

[mypy-fantasy.*]
follow_imports = silent

[mypy-core.*]
follow_imports = silent

[mypy.plugins.django-stubs]
django_settings_module = core.settings

